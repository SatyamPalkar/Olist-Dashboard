[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast tests with no database dependency
    integration: requires PostgreSQL and loaded warehouse
    requires_warehouse: analytics facts/dims must be populated
    raw: validates immutable data/raw CSVs
    slow: longer-running checks over full datasets
filterwarnings =
    ignore::DeprecationWarning
addopts = -ra --strict-markers
